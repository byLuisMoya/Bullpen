name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15        # Apple Silicon
          - runner: macos-15-intel  # Intel: runs the x86_64 slice natively
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - run: swift --version
      - run: make test

  universal-app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - run: make app
      - name: Check both architectures are present
        run: |
          for f in build/Bullpen.app/Contents/MacOS/Bullpen build/bp; do
            archs=$(lipo -archs "$f")
            echo "$f: $archs"
            [[ " $archs " == *" arm64 "* && " $archs " == *" x86_64 "* ]]
          done
      - uses: actions/upload-artifact@v7
        with:
          name: Bullpen-universal
          path: build/
